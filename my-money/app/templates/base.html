<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#101C36">
  <title>{% block title %}{{ platform_name }}{% endblock %} - {{ platform_name }}</title>
  <meta name="description" content="{% block meta_description %}MY MONEY is a secure savings and lending platform for savings groups, SACCOs and community lenders. Record contributions, manage loans and share clear reports.{% endblock %}">
  <link rel="canonical" href="{{ site_url }}{{ request.path }}">
  <link rel="icon" href="{{ site_url }}/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='img/favicon.png') }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ platform_name }}">
  <meta property="og:title" content="{% block og_title %}{{ platform_name }} - Smart savings and lending for groups{% endblock %}">
  <meta property="og:description" content="Smart savings, trusted lending and transparent finance for every group.">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='img/icon-512.png') }}">
  <meta name="twitter:card" content="summary">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="application-name" content="{{ platform_name }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ platform_name }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pwa.css') }}">
</head>
<body>
  {% block body %}{% endblock %}
  <div id="toasts" aria-live="polite"></div>
  {% for category, message in get_flashed_messages(with_categories=true) %}<span class="hide" data-flash="{{ message }}" data-kind="{{ category if category in ('success','error','info') else 'info' }}"></span>{% endfor %}
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  {% if use_charts %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>{% endif %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/responsive.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
