{% extends "base.html" %}
{% from "partials/macros.html" import brand_mark, csrf %}
{% block body %}
<header class="topbar"><a class="pub-brand" href="{{ url_for('groups.select') }}">{{ brand_mark('#101C36', '#1F5FD6') }}<span>{{ platform_name }}</span></a>
<div class="top-actions"><a class="btn btn-sm" href="{{ url_for('groups.select', all=1) }}">My groups</a><form method="post" action="{{ url_for('auth.logout') }}">{{ csrf() }}<button class="btn btn-sm">Logout</button></form></div></header>
<main class="content">{% block content %}{% endblock %}</main>
<footer class="app-foot">MY MONEY &middot; Developed and Powered by Emtrixz Technology Company.</footer>
{% endblock %}
