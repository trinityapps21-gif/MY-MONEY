{% extends "shell_group.html" %}
{% from "partials/macros.html" import csrf %}
{% block title %}New application{% endblock %}
{% block content %}
<div class="page-head"><h1>New loan application</h1><a class="btn" href="{{ url_for('applications.index') }}">Back</a></div>
<div class="card card-pad" style="max-width:640px"><form method="post">{{ csrf() }}<div class="form-grid">
<div class="field full"><label>Borrower</label><select name="borrower_id" required><option value="">Select borrower</option>{% for b in borrowers %}<option value="{{ b.id }}" {{ 'selected' if preselect == b.id }}>{{ b.name }}</option>{% endfor %}</select><div class="hint">Not registered yet? <a href="{{ url_for('borrowers.new') }}">Add the borrower first</a>.</div></div>
<div class="field"><label>Amount requested ({{ current_group.currency }})</label><input type="text" inputmode="decimal" name="amount" required></div>
<div class="field"><label>Product (optional)</label><select name="product_id"><option value="">No product yet</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
<div class="field full"><label>Purpose</label><input type="text" name="purpose" maxlength="300"></div></div>
<button class="btn btn-primary">Record application</button></form></div>
{% endblock %}
