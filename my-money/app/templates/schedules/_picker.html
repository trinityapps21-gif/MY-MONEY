{# day picker for the group's contribution frequency #}
{% macro picker(s, row, weekdays, months) %}
{% if s.contribution_period == 'WEEKLY' %}<select name="due_day">{% for d in weekdays %}<option value="{{ loop.index0 }}" {{ 'selected' if row and row.due_day == loop.index0 }}>{{ d }}</option>{% endfor %}</select>
{% elif s.contribution_period == 'MONTHLY' %}<select name="due_day">{% for d in range(1, 29) %}<option value="{{ d }}" {{ 'selected' if row and row.due_day == d }}>Day {{ d }}</option>{% endfor %}</select>
{% else %}<select name="due_month">{% for m in months %}<option value="{{ loop.index }}" {{ 'selected' if row and row.due_month == loop.index }}>{{ m }}</option>{% endfor %}</select> <select name="due_day">{% for d in range(1, 29) %}<option value="{{ d }}" {{ 'selected' if row and row.due_day == d }}>{{ d }}</option>{% endfor %}</select>{% endif %}
{% endmacro %}
