<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101C36"><title>You are offline - MY MONEY</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F4F8;color:#101C36;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:1px solid #E4E8EF;border-radius:18px;box-shadow:0 12px 34px rgba(16,28,54,.10);max-width:420px;width:100%;padding:32px 26px;text-align:center}

h1{font-size:22px;margin:0 0 8px}p{color:#5B6781;font-size:15px;line-height:1.55;margin:0 0 22px}
button{height:48px;width:100%;border:0;border-radius:10px;background:#142F66;color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
.small{margin:16px 0 0;font-size:12.5px;color:#7A859C}
</style></head>
<body><main class="card">
<img src="/static/img/icon-192.png" alt="MY MONEY" width="84" height="84">
<h1>You are offline</h1>
<p>MY MONEY needs an internet connection to show your group's latest savings, loans and reports. Check your connection and try again.</p>
<button type="button" onclick="location.reload()">Try again</button>
<p class="small">Your records are safe and have not changed.</p>
</main>
<script>window.addEventListener("online",function(){location.reload()})</script>
</body></html>
